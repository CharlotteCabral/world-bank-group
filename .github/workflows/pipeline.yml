name: Pipeline (ingestion + dbt)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  pipeline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      
      - name: Créer le dossier et la clé BigQuery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\dev"
          Set-Content -Path "C:\dev\cle_bigquery.json" -Value '${{ secrets.GCP_SA_KEY }}'

      - name: Configurer le profil dbt
        shell: pwsh
        run: |
          $dbtDir = "$HOME\.dbt"
          if (!(Test-Path $dbtDir)) { New-Item -ItemType Directory -Force -Path $dbtDir }
          @"
          world_bank_group:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: data-quest-tiphaine
                dataset: ga_test
                keyfile: C:\dev\cle_bigquery.json
                location: US
          "@ | Out-File -Encoding utf8 "$dbtDir\profiles.yml"

      - name: Installer les dépendances dbt
        shell: pwsh
        working-directory: world_bank_group
        run: dbt deps

      - name: Lancer le pipeline
        shell: pwsh
        run: python run_pipeline.py
